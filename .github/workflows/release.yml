name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# A push that re-delivers the same tag (HTTP retry, combined `--tags` push)
# must never run two publish jobs in parallel: the loser races to the registry
# and fails on "already published". One run per tag, newest wins.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # @vscode/test-web (a devDependency used only for the CI web-smoke job)
      # pulls in @playwright/browser-chromium. Skip its Chromium download
      # here, since the release pipeline never launches a browser.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Validate Open VSX token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "❌ OVSX_PAT is missing."
            exit 1
          fi
          echo "✅ OVSX_PAT is configured."

      - name: Validate Marketplace token
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "❌ MARKETPLACE_TOKEN is missing."
            exit 1
          fi
          echo "✅ MARKETPLACE_TOKEN is configured."

      - name: Verify tag matches package.json version
        run: |
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "✅ Version $PACKAGE_VERSION matches tag"

      # ffmpeg is used by a handful of tests under test/unit/Demo*.test.ts to
      # measure caption chroma and validate pipeline output. The Ubuntu runner
      # image does not ship ffmpeg by default.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Several demo tests exercise the bundled CLI (dist/demo/*.js). Build
      # dev mode before tests so those artifacts exist; the production build
      # step below re-builds with minification for packaging.
      - name: Build (dev) for tests
        run: node esbuild.js

      # Gate: the tagged release's whats-new.json must match the tag's
      # version AND pass every validation rule. If anything fails, the
      # workflow aborts before publishing — users never see a broken
      # "What's New" panel for this release.
      - name: Validate whats-new.json
        run: node .github/scripts/validate-whats-new.mjs --version "${GITHUB_REF#refs/tags/v}"

      - name: Test
        run: npm test

      - name: Build production
        run: node esbuild.js --production

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Build release body
        run: node .github/scripts/build-release-body.mjs release-body.md

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish -p ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish "kotlin-jump-$(node -e 'console.log(require("./package.json").version)').vsix" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: ${{ github.ref_name }}
          files: '*.vsix'
          fail_on_unmatched_files: true
          body_path: release-body.md
