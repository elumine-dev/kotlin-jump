name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ffmpeg is used by a handful of tests under test/unit/Demo*.test.ts to
      # measure caption chroma and validate pipeline output. The Ubuntu runner
      # image does not ship ffmpeg by default.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Several demo tests exercise the bundled CLI (dist/demo/*.js). Build
      # dev mode before tests so those artifacts exist; the production build
      # step below re-builds with minification for packaging.
      - name: Build (dev) for tests
        run: node esbuild.js

      # Validate the user-visible release notes (media/whats-new.json)
      # early, before tests even run. This catches broken media
      # references, oversized fields, LLM leak patterns, and version
      # drift so a regression cannot sneak through CI.
      - name: Validate whats-new.json
        run: node .github/scripts/validate-whats-new.mjs

      - name: Test
        run: npm test

      - name: Build
        run: node esbuild.js --production

      - name: Package (verify it builds cleanly)
        run: npx @vscode/vsce package --no-dependencies
